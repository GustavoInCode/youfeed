<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouFeed PRO - Secure Checkout</title>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 24px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }
        h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
        p { margin: 0; color: #94a3b8; font-size: 15px; }
        .spinner {
            margin-top: 32px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Y</div>
        <h1>Iniciando ambiente seguro...</h1>
        <p>Aguarde enquanto carregamos o sistema de pagamento oficial do Paddle.</p>
        <div class="spinner"></div>
    </div>
    <script>
        Paddle.Environment.set('production');
        Paddle.Initialize({ 
            token: 'live_f237d7b59b6fb9e70344abd98cb', // PRD Client Token
            eventCallback: function(data) {
                if (data.name === 'checkout.completed') {
                    document.querySelector('h1').innerText = 'Pagamento concluído!';
                    document.querySelector('p').innerText = 'Você já pode fechar esta janela e voltar para a extensão.';
                    document.querySelector('.spinner').style.display = 'none';
                }
                if (data.name === 'checkout.closed') {
                    // Fechou sem pagar, talvez mostrar um botão para reabrir
                    document.querySelector('h1').innerText = 'Checkout cancelado';
                    document.querySelector('p').innerText = 'Se quiser tentar novamente, recarregue a página ou volte para a extensão.';
                    document.querySelector('.spinner').style.display = 'none';
                }
            }
        });

        // Abre o modal de checkout automaticamente
        Paddle.Checkout.open({
            items: [
                {
                    priceId: 'pri_01km0f0sebgbr2rsspeen3g0fh', // PRD Price ID
                    quantity: 1
                }
            ]
        });
    </script>
</body>
</html>
