<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouFeed PRO - Acesso Beta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
            box-sizing: border-box;
        }
        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
        p { margin: 0 0 24px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
        
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }
        button:hover { background-color: #059669; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .message {
            margin-top: 16px;
            font-size: 14px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .message.success { background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); display: block; }
        .message.error { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Y</div>
        <h1>Portal de Testers</h1>
        <p>Resgate o seu convite Beta para desbloquear o YouFeed PRO gratuitamente.</p>

        <form id="betaForm">
            <div class="input-group">
                <label for="email">Seu E-mail principal</label>
                <input type="email" id="email" placeholder="nome@exemplo.com" required>
            </div>
            
            <div class="input-group">
                <label for="code">Código de Convite</label>
                <input type="password" id="code" placeholder="Digite a senha secreta" required>
            </div>

            <button type="submit" id="submitBtn">Desbloquear PRO</button>
            <div id="statusMessage" class="message"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('betaForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            
            if (!email || !code) return;

            // Reset UI
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verificando...';
            statusMessage.className = 'message';
            statusMessage.textContent = '';

            try {
                const response = await fetch('https://youfeed-license.youfeed-license.workers.dev/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMessage.textContent = '🎉 Sucesso! Acesso PRO liberado. Abra a extensão do YouFeed, vá em "Upgrade" e ative com este mesmo e-mail!';
                    statusMessage.className = 'message success';
                    form.reset();
                } else {
                    statusMessage.textContent = data.error || 'Erro ao resgatar o código.';
                    statusMessage.className = 'message error';
                }
            } catch (err) {
                statusMessage.textContent = 'Erro de conexão. Tente novamente mais tarde.';
                statusMessage.className = 'message error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Desbloquear PRO';
            }
        });
    </script>
</body>
</html>
